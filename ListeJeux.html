<style>
  :root{
    --blush:   #fbe6ef;
    --blush-2: #f6d9e8;
    --pink:    #ff6fa0;
    --pink-deep:#ef4b85;
    --wine:    #6f1f42;
    --ink:     #2c1a24;
    --lilac:   #b6a1de;
    --cream:   #fff8fb;
    --line:    #3a2230;

    --display: 'Silkscreen', monospace;
    --body:    'Quicksand', sans-serif;
    --mono:    'Space Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,.55), transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(182,161,222,.25), transparent 45%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0px, rgba(255,255,255,.35) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0px, rgba(255,255,255,.35) 1px, transparent 1px, transparent 26px),
      linear-gradient(160deg, var(--blush) 0%, var(--blush-2) 100%);
    color:var(--ink);
    font-family:var(--body);
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(111,31,66,.035) 0px, rgba(111,31,66,.035) 1px, transparent 1px, transparent 3px);
    z-index:50;
  }

  a{ color:inherit; }

  .floaters{ position:fixed; inset:0; pointer-events:none; z-index:1; }
  .floaters span{
    position:absolute;
    font-size:22px;
    color:var(--pink);
    opacity:.35;
    animation:drift 14s ease-in-out infinite;
    filter:drop-shadow(0 0 6px rgba(255,111,160,.4));
  }
  .floaters span:nth-child(1){ top:8%;  left:6%;  animation-delay:0s;   font-size:16px; }
  .floaters span:nth-child(2){ top:60%; left:3%;  animation-delay:3s;   font-size:26px; color:var(--lilac); }
  .floaters span:nth-child(3){ top:20%; right:7%; animation-delay:1.5s; font-size:20px; }
  .floaters span:nth-child(4){ top:78%; right:10%;animation-delay:5s;   font-size:14px; color:var(--lilac); }
  @keyframes drift{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-22px) rotate(8deg); } }
  @media (prefers-reduced-motion: reduce){ .floaters span{ animation:none; } }

  main{
    position:relative;
    z-index:2;
    max-width:760px;
    margin:0 auto;
    padding:56px 20px 80px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }

  .window{
    background:var(--cream);
    border:3px solid var(--line);
    box-shadow: 6px 6px 0 rgba(111,31,66,.18);
    opacity:0;
    transform:translateY(14px);
    animation:rise .6s ease forwards;
  }
  .window:nth-of-type(2){ animation-delay:.08s; }
  .window:nth-of-type(3){ animation-delay:.16s; }
  .window:nth-of-type(4){ animation-delay:.24s; }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .titlebar{
    background:linear-gradient(90deg, var(--pink) 0%, var(--pink-deep) 100%);
    color:#fff8fb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 10px;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.06em;
    border-bottom:3px solid var(--line);
  }
  .titlebar .name{ display:flex; align-items:center; gap:7px; }
  .titlebar .name::before{ content:"❀"; font-size:11px; }
  .titlebar .btns{ display:flex; gap:5px; }
  .titlebar .btns span{
    width:14px; height:14px;
    background:var(--cream);
    border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:9px; color:var(--wine); line-height:1;
  }

  .window-body{ padding:26px; }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:11px;
    text-decoration:none;
    color:var(--wine);
    margin-bottom:2px;
  }
  .back-link:hover{ color:var(--pink-deep); }

  h1.pagetitle{
    font-family:var(--display);
    font-size:clamp(26px, 6vw, 38px);
    color:var(--wine);
    margin:0 0 8px;
    text-shadow:2px 2px 0 rgba(255,111,160,.35);
  }
  .lede{
    font-size:15.5px;
    line-height:1.55;
    margin:0;
    max-width:52ch;
  }

  /* ---- Ad slots ---- */
  .ad-slot{
    border:2px dashed var(--line);
    background:rgba(255,255,255,.5);
    color:#8a6a78;
    font-family:var(--mono);
    font-size:11px;
    text-align:center;
    padding:18px;
  }

  /* ---- Game grid ---- */
  .game-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:18px;
  }

  .gamecard{
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:var(--ink);
    background:#fff;
    border:2px solid var(--line);
    box-shadow:3px 3px 0 rgba(111,31,66,.14);
    transition:transform .15s ease, box-shadow .15s ease;
    overflow:hidden;
  }
  .gamecard:not(.soon):hover{
    transform:translate(-2px,-2px);
    box-shadow:5px 5px 0 rgba(111,31,66,.22);
  }

  .gamecard .thumb{
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    background: linear-gradient(160deg, #241a3d, #0e0a1c);
    border-bottom:2px solid var(--line);
  }
  .gamecard.soon .thumb{
    background: repeating-linear-gradient(135deg, #efe4ec, #efe4ec 10px, #f6ecf2 10px, #f6ecf2 20px);
    color: var(--lilac);
    font-size:34px;
  }

  .gamecard .info{ padding:14px; }
  .gamecard .label{
    font-weight:700;
    font-size:15px;
    display:block;
    margin-bottom:4px;
  }
  .gamecard .sub{
    font-family:var(--mono);
    font-size:11px;
    color:#7a5f6d;
    display:block;
  }
  .gamecard .tag{
    display:inline-block;
    margin-top:10px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.05em;
    padding:3px 8px;
    border:1px solid var(--line);
    color:var(--wine);
    background:var(--blush);
  }
  .gamecard.soon .tag{ color:#8a6a78; background:#efe4ec; }
  .gamecard.soon{ cursor:default; opacity:.85; }

  footer{
    text-align:center;
    font-family:var(--mono);
    font-size:11px;
    color:#8a6a78;
    padding-top:6px;
  }
  footer .heart{ color:var(--pink-deep); }

  @media (max-width:560px){
    .window-body{ padding:20px 18px; }
  }

  a:focus-visible, .gamecard:focus-visible{
    outline:3px solid var(--wine);
    outline-offset:2px;
  }
</style>

<style>
  #jb{
    position:fixed; right:14px; bottom:14px; z-index:60; width:250px;

    border:3px solid var(--line,#05030a);

    color:var(--ink,#e9e2f2);
  }
  #jb .jb-bar{
    background:linear-gradient(90deg,var(--pumpkin,#ff7a1a),var(--pumpkin-d,#d9560f));
    color:#1a0f00; font-size:11px; font-weight:700; letter-spacing:.06em;
    padding:4px 8px; border-bottom:3px solid var(--line,#05030a);
  }
  #jb .jb-body{ padding:8px 10px; display:flex; flex-direction:column; gap:8px; }
  #jb .jb-title{ font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--moon,#f4ead0); }
  #jb .jb-row{ display:flex; align-items:center; gap:6px; }
  #jb button{
    font:inherit; font-size:13px; line-height:1; cursor:pointer;
    background:var(--panel-2,#140e24); color:var(--moon,#f4ead0);
    border:2px solid var(--line,#05030a); padding:5px 8px;
  }
  #jb button:hover{ background:var(--pumpkin,#ff7a1a); color:#1a0f00; }
  #jb input[type=range]{ flex:1; min-width:0; accent-color:var(--pumpkin,#ff7a1a); }
</style>

<div id="jb" aria-label="Jukebox">
  <div class="jb-bar">♪ JUKEBOX.EXE</div>
  <div class="jb-body">
    <div class="jb-title" id="jbTitle">—</div>
    <div class="jb-row">
      <button id="jbPrev" title="Précédent" aria-label="Précédent">⏮</button>
      <button id="jbPlay" title="Play / Pause" aria-label="Play / Pause">▶</button>
      <button id="jbNext" title="Suivant" aria-label="Suivant">⏭</button>
      <button id="jbMute" title="Couper / remettre le son" aria-label="Son">🔊</button>
      <input id="jbVol" type="range" min="0" max="100" value="40" aria-label="Volume">
    </div>
  </div>
</div>

<script>
(function(){
  const TRACKS = [
    { title:'Up To Something', src:'NoCopyrightUpToSomethingMusic.m4a' },
    // { title:'Titre 2', src:'musique2.mp3' },
    // { title:'Titre 3', src:'musique3.mp3' },
    // { title:'Titre 4', src:'musique4.mp3' },
  ];

  const KEY = 'ladycherri_jukebox';
  let st = { i:0, t:0, v:0.4, m:false, p:false };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){}
  if (st.i >= TRACKS.length) st.i = 0;

  const $ = id => document.getElementById(id);
  const a = new Audio();
  a.preload = 'metadata';
  a.loop = TRACKS.length === 1;
  a.volume = st.v;
  a.muted = st.m;

  function save(){ try { st.t = a.currentTime || 0; localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }

  function ui(){
    $('jbTitle').textContent = TRACKS[st.i].title;
    $('jbPlay').textContent = st.p ? '⏸' : '▶';
    $('jbMute').textContent = (a.muted || a.volume === 0) ? '🔇' : '🔊';
    $('jbVol').value = Math.round(a.volume * 100);
    const multi = TRACKS.length > 1;
    $('jbPrev').style.display = multi ? '' : 'none';
    $('jbNext').style.display = multi ? '' : 'none';
  }

  function load(i, startAt){
    st.i = i;
    a.src = TRACKS[i].src;
    if (startAt) a.addEventListener('loadedmetadata', function f(){ a.currentTime = startAt; a.removeEventListener('loadedmetadata', f); });
    ui();
  }

  function play(){
    a.play().then(function(){ st.p = true; ui(); save(); })
            .catch(function(){ st.p = false; ui(); });   
  }
  function pause(){ a.pause(); st.p = false; ui(); save(); }

  $('jbPlay').onclick = function(){ a.paused ? play() : pause(); };
  $('jbNext').onclick = function(){ load((st.i + 1) % TRACKS.length, 0); play(); };
  $('jbPrev').onclick = function(){ load((st.i - 1 + TRACKS.length) % TRACKS.length, 0); play(); };
  $('jbMute').onclick = function(){ a.muted = !a.muted; st.m = a.muted; ui(); save(); };
  $('jbVol').oninput = function(){
    a.volume = this.value / 100; st.v = a.volume;
    if (a.volume > 0 && a.muted){ a.muted = false; st.m = false; }
    ui(); save();
  };

  a.addEventListener('ended', function(){ if (TRACKS.length > 1){ load((st.i + 1) % TRACKS.length, 0); play(); } });
  a.addEventListener('timeupdate', function(){ if (Math.floor(a.currentTime) % 2 === 0) save(); });
  window.addEventListener('pagehide', save);

  load(st.i, st.t);
  if (st.p) play();
})();
</script>
